[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bigrabozo-inference_rate_limit_queue_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出红队与内容安全工程师·推理服务的限流与排队上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bigrabozo" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bigrabozo.github.io"
Repository = "https://github.com/bigrabozo/inference_rate_limit_queue_dedup"
Issues = "https://github.com/bigrabozo/inference_rate_limit_queue_dedup/issues"

[project.scripts]
inference_rate_limit_queue_dedup = "inference_rate_limit_queue_dedup:main"

[tool.setuptools]
py-modules = ["inference_rate_limit_queue_dedup"]
